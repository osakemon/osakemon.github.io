<!-- _includes/news_row.html -- one row of the news table. Expects `item`. -->
<tr>
  <th scope="row">{% if include.item.date_display %}{{ include.item.date_display }}{% else %}{{ include.item.date | date: "%b %-d, %Y" }}{% endif %}</th>
  <td>
    {%- if include.item.inline -%}
      {{ include.item.content | remove: '<p>' | remove: '</p>' | emojify }}
    {%- else -%}
      <a class="news-title" href="{{ include.item.url | relative_url }}">{{ include.item.title }}</a>
    {%- endif -%}
  </td>
</tr>
