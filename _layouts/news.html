---
layout: default
---
<!-- _layouts/news.html -->
<!-- Standalone page for a single _news entry. Entries are normally rendered
     inline on the about page and at /news/ via _includes/news.html. -->
<div class="post">

  <header class="post-header">
    {%- if page.title %}
    <h1 class="post-title">{{ page.title }}</h1>
    {%- endif %}
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>
