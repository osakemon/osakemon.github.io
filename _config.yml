# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # if "blank", the full name below is used as the site title instead
first_name: Weiqing
middle_name:
last_name: Chen
email: wec4005@med.cornell.edu
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Personal website of Weiqing Chen, PhD candidate at Weill Cornell Medicine. Research in AI/ML for computational biology, spatial transcriptomics, and multimodal foundation models.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: Weiqing Chen, computational biology, spatial transcriptomics, foundation models, machine learning, bioinformatics

lang: en
icon: # favicon: an emoji, or an image filename under /assets/img/. Blank = none.

url: https://osakemon.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /subpath/ -- empty for a user site
last_updated: true # display "last updated" in the footer
impressum_path: # path to an impressum page, shown in the footer if set

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# code highlighter theme, see https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_light: github
highlight_theme_dark: native

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.

serve_og_meta: false # include Open Graph meta tags in the HTML head
serve_schema_org: false # include Schema.org in the HTML head
og_image: # site-wide default Open Graph preview image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
# Only the handles set here are rendered. _includes/social.html additionally
# supports orcid_id, linkedin_username, mastodon_username, research_gate_profile,
# semanticscholar_id, osf_id and others -- add the matching key to enable one.

github_username: osakemon
twitter_username: wchen4005
scholar_userid: Dh7tSbYAAAAJ # Google Scholar ID
orcid_id:
linkedin_username:

contact_note:

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics: # Google Analytics measurement ID (format: G-XXXXXXXXXX)
google_site_verification: # google-site-verification ID (Google Search Console)
bing_site_verification: # bing-site-verification ID (Bing Webmaster)

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: news
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Note: a top-level `news:` settings block cannot work here -- the `news`
# collection shadows it, so `site.news` is always the array of entries.
# _includes/news.html therefore renders every entry, newest first.

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
# Anything not listed here and not recognised by Jekyll is copied straight into
# _site and served publicly -- keep private working directories excluded.
include: ['_pages']
exclude:
  - cv_work
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-email-protect
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  exclude: ['robots.txt']

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name: [Chen]
  first_name: [Weiqing]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

badges: # Display different badges for your publications
  altmetric_badge: true # https://www.altmetric.com/products/altmetric-badges/
  dimensions_badge: true # https://badge.dimensions.ai/

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric]

# Maximum number of authors to be shown for each publication; the rest collapse
# behind a click. Needed because the Circ Res paper carries 45 authors.
max_author_limit: 10
more_authors_animation_delay: 10 # smaller delay means faster reveal animation

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true # see https://github.com/alshedivat/al-folio/issues/537
  widths:
    - 480
    - 800
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-resize 400x"

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics:    false  # enables google analytics
enable_google_verification: false  # enables google site verification
enable_bing_verification:   false  # enables bing site verification
enable_masonry:             true   # enables automatic project cards arrangement
enable_math:                true   # enables math typesetting (uses MathJax)
enable_tooltips:            false  # enables automatic tooltip links generated
                                   # for each section titles on pages and posts
enable_darkmode:            true   # enables switching between light/dark modes
enable_navbar_social:       true   # enables displaying social links in the
                                   # navbar on the about page
enable_project_categories:  true   # enables categorization of projects into
                                   # multiple categories
enable_medium_zoom:         true   # enables image zoom feature (as on medium.com)
enable_progressbar:         true   # enables a horizontal progress bar linked to the vertical scroll position

